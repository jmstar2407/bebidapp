<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio - Diseño Gráfico</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-light: #f1f5f9;
            --text-gray: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1e293b 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
            touch-action: pan-y; /* Mejora desplazamiento en móviles */
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: clamp(1rem, 2vw, 1.2rem);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            background: var(--bg-card);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            aspect-ratio: 4/3;
            user-select: none;
            -webkit-user-select: none;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .gallery-item::after {
            content: '🔍';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 3rem;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .gallery-item:hover::after {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            touch-action: pan-y pinch-zoom;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            animation: zoomIn 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 10px;
            transition: transform 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Indicadores de desplazamiento táctil */
        .swipe-hint {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            margin: 0 auto;
            width: fit-content;
            display: none;
            z-index: 1001;
            pointer-events: none;
        }

        .swipe-hint span {
            margin: 0 10px;
            font-size: 1.5rem;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Animación de deslizamiento */
        @keyframes slideFromRight {
            from {
                transform: translateX(100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideFromLeft {
            from {
                transform: translateX(-100px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .slide-right {
            animation: slideFromRight 0.3s ease;
        }

        .slide-left {
            animation: slideFromLeft 0.3s ease;
        }

        .close-btn, .nav-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 50%;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 1001;
            user-select: none;
            -webkit-user-select: none;
        }

        .close-btn:hover, .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .close-btn {
            top: 20px;
            right: 20px;
        }

        .prev-btn {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .next-btn {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-gray);
        }

        /* Indicador de posición (dots) */
        .image-indicator {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 1001;
        }

        .indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .indicator-dot.active {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.2);
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
                padding: 10px;
            }

            header {
                padding: 20px 10px;
            }

            .close-btn, .nav-btn {
                font-size: 1.5rem;
                padding: 8px 15px;
            }

            .prev-btn, .next-btn {
                top: auto;
                bottom: 20px;
                transform: none;
            }

            .prev-btn {
                left: 20px;
            }

            .next-btn {
                right: 20px;
            }

            .swipe-hint {
                display: block;
                animation: fadeInOut 3s ease;
            }

            @keyframes fadeInOut {
                0% { opacity: 0; }
                20% { opacity: 1; }
                80% { opacity: 1; }
                100% { opacity: 0; }
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
            
            .swipe-hint {
                bottom: 70px;
                font-size: 0.9rem;
            }
            
            .swipe-hint span {
                font-size: 1.2rem;
            }
        }

        /* Prevenir zoom en doble toque */
        .modal-content {
            touch-action: pan-y;
        }

        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Portafolio</h1>
            <p class="subtitle">Diseño Gráfico</p>
        </header>

        <div class="gallery" id="gallery">
            <div class="loading">Cargando imágenes...</div>
        </div>
    </div>

    <div class="modal" id="modal">
        <button class="close-btn" onclick="closeModal()">×</button>
        <button class="nav-btn prev-btn" onclick="navigateImage(-1)">‹</button>
        
        <div class="modal-content" id="modalContent">
            <img id="modalImg" src="" alt="Imagen ampliada">
        </div>
        
        <button class="nav-btn next-btn" onclick="navigateImage(1)">›</button>
        
        <!-- Indicador de posición -->
        <div class="image-indicator" id="imageIndicator"></div>
        
        <!-- Indicador de desplazamiento táctil (solo móvil) -->
        <div class="swipe-hint" id="swipeHint">
            Desliza para cambiar de imagen <span>← →</span>
        </div>
    </div>

    <script>
        const totalImages = 45; // 👈 CAMBIA ESTE NÚMERO según cuántas imágenes tengas
        const extensions = ['jpg', 'png', 'jpeg', 'JPG', 'PNG', 'JPEG'];
        let currentImageIndex = 0;
        let loadedImages = [];
        
        // Variables para el control táctil
        let touchStartX = 0;
        let touchEndX = 0;
        let touchStartY = 0;
        let touchEndY = 0;
        let isSwiping = false;
        const SWIPE_THRESHOLD = 50; // Mínimo de píxeles para considerar un deslizamiento

        async function loadImages() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            
            for (let i = 1; i <= totalImages; i++) {
                let imageLoaded = false;
                
                for (const ext of extensions) {
                    const imgPath = `img/port-img (${i}).${ext}`;
                    
                    try {
                        const exists = await checkImageExists(imgPath);
                        if (exists) {
                            createGalleryItem(imgPath, i - 1);
                            loadedImages.push(imgPath);
                            imageLoaded = true;
                            break;
                        }
                    } catch (e) {
                        continue;
                    }
                }
                
                if (!imageLoaded) {
                    console.warn(`No se encontró la imagen: port-img (${i})`);
                }
            }

            if (loadedImages.length === 0) {
                gallery.innerHTML = '<div class="loading">No se encontraron imágenes. Asegúrate de que las imágenes estén en la carpeta "img"</div>';
            }
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
            });
        }

        function createGalleryItem(src, index) {
            const gallery = document.getElementById('gallery');
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.onclick = () => openModal(index);
            
            const img = document.createElement('img');
            img.src = src;
            img.alt = `Diseño ${index + 1}`;
            img.loading = 'lazy';
            
            item.appendChild(img);
            gallery.appendChild(item);
        }

        function openModal(index) {
            currentImageIndex = index;
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modalImg');
            const modalContent = document.getElementById('modalContent');
            
            modalImg.src = loadedImages[index];
            modal.classList.add('active');
            
            // Quitar animaciones previas
            modalContent.classList.remove('slide-left', 'slide-right');
            
            document.body.style.overflow = 'hidden';
            
            // Actualizar indicadores
            updateImageIndicator();
            
            // Agregar eventos táctiles
            setupTouchEvents();
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
            
            // Remover eventos táctiles
            removeTouchEvents();
        }

        function navigateImage(direction, isSwipe = false) {
            const modalImg = document.getElementById('modalImg');
            const modalContent = document.getElementById('modalContent');
            
            // Aplicar animación de deslizamiento
            if (isSwipe) {
                modalContent.classList.remove('slide-left', 'slide-right');
                void modalContent.offsetWidth; // Forzar reflow
                
                if (direction > 0) {
                    modalContent.classList.add('slide-left');
                } else {
                    modalContent.classList.add('slide-right');
                }
            }
            
            currentImageIndex += direction;
            
            if (currentImageIndex < 0) {
                currentImageIndex = loadedImages.length - 1;
            } else if (currentImageIndex >= loadedImages.length) {
                currentImageIndex = 0;
            }
            
            modalImg.src = loadedImages[currentImageIndex];
            
            // Actualizar indicadores
            updateImageIndicator();
        }

        function updateImageIndicator() {
            const indicator = document.getElementById('imageIndicator');
            indicator.innerHTML = '';
            
            for (let i = 0; i < loadedImages.length; i++) {
                const dot = document.createElement('div');
                dot.className = 'indicator-dot';
                if (i === currentImageIndex) {
                    dot.classList.add('active');
                }
                
                dot.addEventListener('click', () => {
                    currentImageIndex = i;
                    document.getElementById('modalImg').src = loadedImages[currentImageIndex];
                    updateImageIndicator();
                });
                
                indicator.appendChild(dot);
            }
        }

        // Configurar eventos táctiles
        function setupTouchEvents() {
            const modalContent = document.getElementById('modalContent');
            const modalImg = document.getElementById('modalImg');
            
            modalContent.addEventListener('touchstart', handleTouchStart, { passive: true });
            modalContent.addEventListener('touchmove', handleTouchMove, { passive: true });
            modalContent.addEventListener('touchend', handleTouchEnd, { passive: true });
            
            // También para la imagen por si acaso
            modalImg.addEventListener('touchstart', handleTouchStart, { passive: true });
            modalImg.addEventListener('touchmove', handleTouchMove, { passive: true });
            modalImg.addEventListener('touchend', handleTouchEnd, { passive: true });
        }

        function removeTouchEvents() {
            const modalContent = document.getElementById('modalContent');
            const modalImg = document.getElementById('modalImg');
            
            modalContent.removeEventListener('touchstart', handleTouchStart);
            modalContent.removeEventListener('touchmove', handleTouchMove);
            modalContent.removeEventListener('touchend', handleTouchEnd);
            
            modalImg.removeEventListener('touchstart', handleTouchStart);
            modalImg.removeEventListener('touchmove', handleTouchMove);
            modalImg.removeEventListener('touchend', handleTouchEnd);
        }

        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            isSwiping = true;
        }

        function handleTouchMove(e) {
            if (!isSwiping) return;
            
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            
            // Mover ligeramente la imagen durante el deslizamiento
            const modalImg = document.getElementById('modalImg');
            const diffX = touchEndX - touchStartX;
            
            // Solo mover horizontalmente si es un deslizamiento horizontal
            if (Math.abs(diffX) > Math.abs(touchEndY - touchStartY)) {
                e.preventDefault();
                modalImg.style.transform = `translateX(${diffX * 0.3}px)`;
            }
        }

        function handleTouchEnd(e) {
            if (!isSwiping) return;
            
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            
            // Restablecer transformación de la imagen
            const modalImg = document.getElementById('modalImg');
            modalImg.style.transform = '';
            
            // Determinar si fue un deslizamiento horizontal
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            // Si el movimiento horizontal es mayor que el vertical, es un deslizamiento horizontal
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > SWIPE_THRESHOLD) {
                // Deslizamiento de izquierda a derecha (ir a imagen anterior)
                if (diffX > 0) {
                    navigateImage(-1, true);
                } 
                // Deslizamiento de derecha a izquierda (ir a imagen siguiente)
                else {
                    navigateImage(1, true);
                }
            }
            
            isSwiping = false;
        }

        // Cerrar modal con tecla ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'ArrowLeft') navigateImage(-1);
            if (e.key === 'ArrowRight') navigateImage(1);
        });

        // Cerrar modal al hacer clic fuera de la imagen
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // Cargar imágenes al iniciar
        loadImages();
        
        // Detectar si es un dispositivo táctil
        function isTouchDevice() {
            return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        }
        
        // Ocultar indicador táctil después de 3 segundos
        if (isTouchDevice()) {
            setTimeout(() => {
                const swipeHint = document.getElementById('swipeHint');
                if (swipeHint) {
                    swipeHint.style.display = 'none';
                }
            }, 3000);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Portafolio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f0f0f;
      color: #fff;
    }
    header {
      padding: 1.5rem;
      text-align: center;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
    }
    header h1 { margin: 0; font-size: 2rem; }
    header p { margin-top: .5rem; opacity: .9; }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .gallery img:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 25px rgba(0,0,0,.5);
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 12px;
    }

    .modal.active { display: flex; }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: .9rem;
      opacity: .7;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mi Portafolio</h1>
    <p>Diseño gráfico · Branding · Creatividad</p>
  </header>

  <main>
    <div id="gallery" class="gallery"></div>
  </main>

  <div id="modal" class="modal" onclick="closeModal()">
    <img id="modalImg" src="" alt="Vista previa" />
  </div>

  <footer>
    © 2026 · Tu Nombre
  </footer>

  <script>
    /*
      IMPORTANTE:
      Este método funciona cuando el hosting permite listar archivos
      (por ejemplo Apache, XAMPP, algunos VPS).

      Carpeta esperada:
      /img
        imagen1.jpg
        imagen2.png
        imagen3.gif
    */

    const gallery = document.getElementById('gallery');
    const supportedFormats = ['jpg', 'jpeg', 'png', 'gif', 'webp'];

    fetch('img/')
      .then(res => res.text())
      .then(html => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const links = [...doc.querySelectorAll('a')];

        links.forEach(link => {
          const href = link.getAttribute('href');
          const ext = href.split('.').pop().toLowerCase();

          if (supportedFormats.includes(ext)) {
            const img = document.createElement('img');
            img.src = 'img/' + href;
            img.alt = 'Diseño gráfico';
            img.onclick = () => openModal(img.src);
            gallery.appendChild(img);
          }
        });
      })
      .catch(() => {
        gallery.innerHTML = '<p>No se pudieron cargar las imágenes.</p>';
      });

    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }
  </script>

</body>
</html>

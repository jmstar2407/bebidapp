<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio - Diseño Gráfico</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-light: #f1f5f9;
            --text-gray: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1e293b 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: clamp(1rem, 2vw, 1.2rem);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding: 20px;
            will-change: transform;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            background: var(--bg-card);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transform: translateZ(0); /* Aceleración GPU */
            backface-visibility: hidden;
            will-change: transform;
            aspect-ratio: 4/3;
            -webkit-tap-highlight-color: transparent;
        }

        /* Hover optimizado - solo transform y opacity */
        .gallery-item:hover {
            transform: translate3d(0, -5px, 0);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateZ(0);
            will-change: transform;
        }

        /* Hover más ligero para la imagen */
        .gallery-item:hover img {
            transform: scale(1.05);
        }

        /* Eliminado el pseudoelemento con efecto complejo */
        .gallery-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
            pointer-events: none;
        }

        .gallery-item:hover::before {
            opacity: 1;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.2s ease;
            will-change: opacity;
        }

        .modal.active {
            display: flex;
            opacity: 1;
            animation: modalFadeIn 0.2s ease forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            transform: translateZ(0);
            will-change: transform, opacity;
        }

        .modal-content img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 10px;
            transform: translateZ(0);
            backface-visibility: hidden;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        /* Animaciones simplificadas para deslizamiento */
        .slide-left {
            animation: slideFromRight 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .slide-right {
            animation: slideFromLeft 0.25s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes slideFromRight {
            0% {
                transform: translate3d(100px, 0, 0);
                opacity: 0;
            }
            100% {
                transform: translate3d(0, 0, 0);
                opacity: 1;
            }
        }

        @keyframes slideFromLeft {
            0% {
                transform: translate3d(-100px, 0, 0);
                opacity: 0;
            }
            100% {
                transform: translate3d(0, 0, 0);
                opacity: 1;
            }
        }

        .close-btn, .nav-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 2rem;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 50%;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            z-index: 1001;
            -webkit-tap-highlight-color: transparent;
            transform: translateZ(0);
        }

        .close-btn:hover, .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05) translateZ(0);
        }

        .close-btn {
            top: 20px;
            right: 20px;
        }

        .prev-btn {
            left: 20px;
            top: 50%;
            transform: translateY(-50%) translateZ(0);
        }

        .next-btn {
            right: 20px;
            top: 50%;
            transform: translateY(-50%) translateZ(0);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--text-gray);
        }

        /* Indicador de desplazamiento táctil mejorado */
        .swipe-hint {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            display: none;
            z-index: 1001;
            pointer-events: none;
            white-space: nowrap;
            will-change: opacity;
            animation: hintPulse 3s ease-in-out forwards;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0; }
            20%, 80% { opacity: 1; }
        }

        .swipe-hint span {
            margin: 0 8px;
            font-size: 1.3rem;
        }

        /* Indicador de posición optimizado */
        .image-indicator {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 1001;
            transform: translateZ(0);
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.15s ease;
            cursor: pointer;
            transform: translateZ(0);
        }

        .indicator-dot.active {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.2) translateZ(0);
            width: 12px;
            border-radius: 6px;
        }

        /* Media queries optimizadas */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
                padding: 10px;
            }

            header {
                padding: 20px 10px;
            }

            .close-btn, .nav-btn {
                font-size: 1.5rem;
                padding: 8px 16px;
            }

            .prev-btn, .next-btn {
                top: auto;
                bottom: 20px;
                transform: none;
            }

            .prev-btn {
                left: 20px;
            }

            .next-btn {
                right: 20px;
            }

            .swipe-hint {
                bottom: 80px;
                font-size: 0.9rem;
                padding: 10px 16px;
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .gallery-item {
                aspect-ratio: 16/9;
            }
            
            .swipe-hint {
                bottom: 70px;
                font-size: 0.85rem;
            }
            
            .swipe-hint span {
                font-size: 1.1rem;
            }
            
            .image-indicator {
                bottom: 60px;
            }
        }

        /* Prevenir renderizado costoso */
        .gallery-item, .modal-content img, .close-btn, .nav-btn {
            contain: layout paint style;
        }

        /* Optimización para Safari */
        @supports (-webkit-touch-callout: none) {
            .gallery-item {
                -webkit-transform: translateZ(0);
            }
            
            .modal {
                -webkit-backface-visibility: hidden;
            }
        }

        /* Mejorar scroll performance */
        .gallery {
            transform: translate3d(0, 0, 0);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Portafolio</h1>
            <p class="subtitle">Diseño Gráfico</p>
        </header>

        <div class="gallery" id="gallery">
            <div class="loading">Cargando imágenes...</div>
        </div>
    </div>

    <div class="modal" id="modal">
        <button class="close-btn" onclick="closeModal()">×</button>
        <button class="nav-btn prev-btn" onclick="navigateImage(-1)">‹</button>
        
        <div class="modal-content" id="modalContent">
            <img id="modalImg" src="" alt="Imagen ampliada">
        </div>
        
        <button class="nav-btn next-btn" onclick="navigateImage(1)">›</button>
        
        <div class="image-indicator" id="imageIndicator"></div>
        
        <div class="swipe-hint" id="swipeHint">
            Desliza para cambiar <span>← →</span>
        </div>
    </div>

    <script>
        const totalImages = 45;
        const extensions = ['jpg', 'png', 'jpeg', 'JPG', 'PNG', 'JPEG', 'webp', 'WEBP'];
        let currentImageIndex = 0;
        let loadedImages = [];
        let imageCache = new Map(); // Cache de imágenes pre-cargadas
        
        // Variables para el control táctil
        let touchStartX = 0;
        let touchEndX = 0;
        let isSwiping = false;
        let animationFrameId = null;
        const SWIPE_THRESHOLD = 30; // Umbral reducido para mejor respuesta

        // Precargar imágenes en segundo plano
        async function preloadImages() {
            for (let i = 1; i <= totalImages; i++) {
                for (const ext of extensions) {
                    const imgPath = `img/port-img (${i}).${ext}`;
                    try {
                        const exists = await checkImageExists(imgPath);
                        if (exists && !imageCache.has(imgPath)) {
                            const img = new Image();
                            img.src = imgPath;
                            imageCache.set(imgPath, img);
                            break;
                        }
                    } catch (e) {
                        continue;
                    }
                }
            }
        }

        async function loadImages() {
            const gallery = document.getElementById('gallery');
            
            // Mostrar carga optimizada
            if (!gallery.querySelector('.gallery-item')) {
                gallery.innerHTML = '<div class="loading">Cargando imágenes...</div>';
            }
            
            // Cargar en lotes para mejor performance
            const batchSize = 10;
            const totalBatches = Math.ceil(totalImages / batchSize);
            
            for (let batch = 0; batch < totalBatches; batch++) {
                const start = batch * batchSize + 1;
                const end = Math.min((batch + 1) * batchSize, totalImages);
                
                for (let i = start; i <= end; i++) {
                    let imageLoaded = false;
                    
                    for (const ext of extensions) {
                        const imgPath = `img/port-img (${i}).${ext}`;
                        
                        if (imageCache.has(imgPath)) {
                            createGalleryItem(imgPath, loadedImages.length);
                            loadedImages.push(imgPath);
                            imageLoaded = true;
                            break;
                        }
                        
                        try {
                            const exists = await checkImageExists(imgPath);
                            if (exists) {
                                createGalleryItem(imgPath, loadedImages.length);
                                loadedImages.push(imgPath);
                                // Pre-cargar en cache
                                const img = new Image();
                                img.src = imgPath;
                                imageCache.set(imgPath, img);
                                imageLoaded = true;
                                break;
                            }
                        } catch (e) {
                            continue;
                        }
                    }
                    
                    if (!imageLoaded) {
                        console.warn(`No se encontró la imagen: port-img (${i})`);
                    }
                }
                
                // Permitir que el navegador renderice
                await new Promise(resolve => setTimeout(resolve, 0));
            }

            if (loadedImages.length === 0) {
                gallery.innerHTML = '<div class="loading">No se encontraron imágenes. Asegúrate de que las imágenes estén en la carpeta "img"</div>';
            }
        }

        function checkImageExists(url) {
            return new Promise((resolve) => {
                if (imageCache.has(url)) {
                    resolve(true);
                    return;
                }
                
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = url;
                
                // Timeout para evitar esperas infinitas
                setTimeout(() => resolve(false), 1000);
            });
        }

        function createGalleryItem(src, index) {
            const gallery = document.getElementById('gallery');
            const loadingElement = gallery.querySelector('.loading');
            
            if (loadingElement && gallery.children.length === 1) {
                gallery.innerHTML = '';
            }
            
            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            // Usar event delegation para mejor performance
            item.dataset.index = index;
            
            const img = document.createElement('img');
            img.src = src;
            img.alt = `Diseño ${index + 1}`;
            img.loading = 'lazy';
            img.decoding = 'async';
            
            item.appendChild(img);
            gallery.appendChild(item);
        }

        // Event delegation para los items de la galería
        document.getElementById('gallery').addEventListener('click', (e) => {
            let target = e.target;
            while (target && !target.classList.contains('gallery-item')) {
                if (target === document.getElementById('gallery')) return;
                target = target.parentElement;
            }
            
            if (target && target.dataset.index) {
                openModal(parseInt(target.dataset.index));
            }
        });

        function openModal(index) {
            currentImageIndex = index;
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modalImg');
            const modalContent = document.getElementById('modalContent');
            
            // Prevenir animaciones previas
            modalContent.classList.remove('slide-left', 'slide-right');
            
            // Cambiar imagen sin animación inicial
            modalImg.src = loadedImages[index];
            
            // Mostrar modal con animación ligera
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            
            // Actualizar indicadores
            updateImageIndicator();
            
            // Configurar eventos táctiles
            setupTouchEvents();
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            
            // Pequeño delay para permitir la animación de salida
            setTimeout(() => {
                document.body.style.overflow = 'auto';
            }, 200);
            
            removeTouchEvents();
        }

        function navigateImage(direction, isSwipe = false) {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            
            const modalImg = document.getElementById('modalImg');
            const modalContent = document.getElementById('modalContent');
            
            // Calcular nuevo índice
            let newIndex = currentImageIndex + direction;
            if (newIndex < 0) newIndex = loadedImages.length - 1;
            if (newIndex >= loadedImages.length) newIndex = 0;
            
            // Animación suave
            if (isSwipe) {
                modalContent.classList.remove('slide-left', 'slide-right');
                
                // Forzar reflow de manera optimizada
                void modalContent.offsetWidth;
                
                if (direction > 0) {
                    modalContent.classList.add('slide-left');
                } else {
                    modalContent.classList.add('slide-right');
                }
            }
            
            // Usar requestAnimationFrame para cambio sincronizado
            animationFrameId = requestAnimationFrame(() => {
                currentImageIndex = newIndex;
                modalImg.src = loadedImages[currentImageIndex];
                updateImageIndicator();
                animationFrameId = null;
            });
        }

        function updateImageIndicator() {
            const indicator = document.getElementById('imageIndicator');
            
            // Solo actualizar si es necesario
            if (indicator.children.length !== loadedImages.length) {
                indicator.innerHTML = '';
                
                for (let i = 0; i < loadedImages.length; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'indicator-dot';
                    if (i === currentImageIndex) {
                        dot.classList.add('active');
                    }
                    
                    dot.addEventListener('click', () => {
                        if (i !== currentImageIndex) {
                            currentImageIndex = i;
                            document.getElementById('modalImg').src = loadedImages[currentImageIndex];
                            updateImageIndicator();
                        }
                    });
                    
                    indicator.appendChild(dot);
                }
            } else {
                // Solo actualizar clases activas
                const dots = indicator.children;
                for (let i = 0; i < dots.length; i++) {
                    if (i === currentImageIndex) {
                        dots[i].classList.add('active');
                    } else {
                        dots[i].classList.remove('active');
                    }
                }
            }
        }

        // Eventos táctiles optimizados
        function setupTouchEvents() {
            const modalContent = document.getElementById('modalContent');
            
            modalContent.addEventListener('touchstart', handleTouchStart, { passive: true });
            modalContent.addEventListener('touchmove', handleTouchMove, { passive: false });
            modalContent.addEventListener('touchend', handleTouchEnd, { passive: true });
        }

        function removeTouchEvents() {
            const modalContent = document.getElementById('modalContent');
            
            modalContent.removeEventListener('touchstart', handleTouchStart);
            modalContent.removeEventListener('touchmove', handleTouchMove);
            modalContent.removeEventListener('touchend', handleTouchEnd);
        }

        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            isSwiping = true;
        }

        function handleTouchMove(e) {
            if (!isSwiping) return;
            
            e.preventDefault();
            touchEndX = e.touches[0].clientX;
        }

        function handleTouchEnd() {
            if (!isSwiping) return;
            
            const diffX = touchEndX - touchStartX;
            
            if (Math.abs(diffX) > SWIPE_THRESHOLD) {
                if (diffX > 0) {
                    navigateImage(-1, true);
                } else {
                    navigateImage(1, true);
                }
            }
            
            isSwiping = false;
        }

        // Eventos de teclado
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('modal').classList.contains('active')) return;
            
            switch(e.key) {
                case 'Escape':
                    closeModal();
                    break;
                case 'ArrowLeft':
                    navigateImage(-1);
                    break;
                case 'ArrowRight':
                    navigateImage(1);
                    break;
            }
        });

        // Cerrar modal al hacer clic fuera
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') {
                closeModal();
            }
        });

        // Inicializar
        async function init() {
            // Iniciar precarga en segundo plano
            preloadImages();
            
            // Cargar primeras imágenes para mostrar rápido
            await loadImages();
            
            // Detectar dispositivo táctil
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                const swipeHint = document.getElementById('swipeHint');
                swipeHint.style.display = 'block';
                
                setTimeout(() => {
                    swipeHint.style.display = 'none';
                }, 3000);
            }
        }

        // Iniciar cuando el DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
